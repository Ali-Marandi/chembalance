name: Test, package, and release ChemBalance Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test core (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test and desktop dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Run complete test suite
        env:
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -v

  package:
    name: Package ${{ matrix.platform }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: macos-x64
            runner: macos-13
          - platform: macos-arm64
            runner: macos-14
          - platform: linux-x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install packaging dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Run headless desktop smoke test
        env:
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
        run: python ui_smoke_test.py
      - name: Build native release archive
        run: python scripts/package_desktop.py --platform ${{ matrix.platform }}
      - name: Upload packaged release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish archive and checksum files
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## ChemBalance Desktop

            This release contains native packages for Windows, macOS, and Linux.

            ### Installation

            - **Windows x64:** Extract `ChemBalance-windows-x64.zip`, then run `ChemBalance.exe`.
            - **macOS Intel:** Extract `ChemBalance-macos-x64.zip`, then open `ChemBalance.app`.
            - **macOS Apple Silicon:** Extract `ChemBalance-macos-arm64.zip`, then open `ChemBalance.app`.
            - **Linux x64:** Extract `ChemBalance-linux-x64.tar.gz`, then run `ChemBalance/ChemBalance`.

            Verify every downloaded archive against its companion SHA-256 file when required. ChemBalance verifies mathematical conservation; it does not establish chemical feasibility, hazards, or safe operating conditions.
          files: release-assets/*
